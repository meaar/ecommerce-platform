services:
  backend:
    build: ./backend
    container_name: ecommerce-backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    networks:
      - ecommerce-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce-development-password
    volumes:
      - postgres-data-v18:/var/lib/postgresql
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  ecommerce-net:
    external: true

volumes:
  postgres-data-v18:
