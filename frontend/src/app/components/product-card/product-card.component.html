<article class="product-card">
  <div class="image-container">
    <img
      [src]="product().image"
      [alt]="product().name"
      class="product-image"
      width="250"
      height="200"
      loading="eager"
    >
    @if (product().stock <= 5) {
      <span class="stock-warning" aria-label="Últimas unidades">Últimas unidades</span>
    }
  </div>

  <div class="content">
    <h2 class="product-name">{{ product().name }}</h2>

    <p class="category">{{ product().category }}</p>

    <div class="rating">
      <span class="stars" [attr.aria-label]="'Avaliação: ' + product().rating + ' de 5'">
        ⭐ {{ product().rating }}
      </span>
    </div>

    <p class="description">{{ product().description }}</p>

    <div class="footer">
      <div class="price">
        <span class="currency">R$</span>
        <span class="amount">{{ product().price | number: '1.2-2' : 'pt-BR' }}</span>
      </div>

      <div class="actions">
        <a [routerLink]="['/product', product().id]" class="btn-view">Ver detalhes</a>
        <button
          class="btn-add"
          (click)="addToCart()"
          [disabled]="product().stock === 0"
          [attr.aria-label]="'Adicionar ' + product().name + ' ao carrinho'"
        >
          Adicionar
        </button>
      </div>
    </div>
  </div>
</article>
