<article class="product-card">
  <div class="image-container">
    <img
      ngSrc="product().image"
      [alt]="product().name"
      class="product-image"
      width="250"
      height="200"
      loading="lazy"
    >
    @if (product().stock <= 5) {
      <span class="stock-warning" aria-label="Low stock">Low Stock</span>
    }
  </div>

  <div class="content">
    <h2 class="product-name">{{ product().name }}</h2>

    <p class="category">{{ product().category }}</p>

    <div class="rating">
      <span class="stars" [attr.aria-label]="'Rating: ' + product().rating + ' out of 5'">
        ⭐ {{ product().rating }}
      </span>
    </div>

    <p class="description">{{ product().description }}</p>

    <div class="footer">
      <div class="price">
        <span class="currency">$</span>
        <span class="amount">{{ product().price | number: '1.2-2' }}</span>
      </div>

      <div class="actions">
        <a [routerLink]="['/product', product().id]" class="btn-view">View Details</a>
        <button
          class="btn-add"
          (click)="addToCart()"
          [disabled]="product().stock === 0"
          [attr.aria-label]="'Add ' + product().name + ' to cart'"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </div>
</article>
